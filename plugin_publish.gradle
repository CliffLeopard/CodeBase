pluginBundle {
    website =       rootProject.ext.CODE_BASE_SITE
    vcsUrl =        rootProject.ext.CODE_BASE_GIT_URL
    description =   rootProject.ext.CODE_BASE_DESC
    tags = ['plugin', 'interesting']

    plugins {
        codebasePlugin {
            displayName = rootProject.ext.CB_DISPLAY_NAME
        }
    }
    mavenCoordinates {
        groupId = rootProject.ext.CODE_BASE_GROUP
        artifactId = project.name
        version = rootProject.ext.CODE_BASE_VERSION
    }
}